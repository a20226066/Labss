# El CLIENTE es una segunda aplicación y debe usar otro puerto.
server.port=8081
spring.application.name=cliente-web

# Dirección REST que consumirá desde el servidor con RestClient.
servidor.api.base-url=http://localhost:8080

# El servidor responde JSON snake_case; el cliente lo convierte a campos Java camelCase.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Para aprender: evita cachear las vistas HTML mientras editas en IntelliJ.
spring.thymeleaf.cache=false
