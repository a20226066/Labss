<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Detalle de API</title>
<link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><main class="contenedor pequeno">
    <h1 th:text="${api.nombre}">Detalle</h1>
    <dl>
        <dt>ID</dt><dd th:text="${api.id}"></dd>
        <dt>Versión</dt><dd th:text="${api.version}"></dd>
        <dt>Fecha de registro</dt><dd th:text="${api.fechaRegistro}"></dd>
        <dt>Estado</dt><dd th:text="${api.estado}"></dd>
        <dt>Equipo</dt><dd th:text="|${api.equipo.nombre} (${api.equipo.area})|"></dd>
    </dl>
    <p><a th:href="@{/apis}">Volver al listado</a></p>
</main></body></html>
