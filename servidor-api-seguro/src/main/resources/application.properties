# SERVIDOR REST (sin Thymeleaf): recibe peticiones del cliente en el puerto 8080.
server.port=8080
spring.application.name=servidor-api-seguro

# Usa MySQL local; cambia usuario y contrasena segun tu instalacion.
spring.datasource.url=jdbc:mysql://localhost:3306/gtics_lab9?serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Tablas creadas con el script SQL. 'validate' comprueba que existan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# EXIGENCIA DEL PDF: convertir fechaRegistro -> fecha_registro en TODO el JSON.
spring.jackson.property-naming-strategy=SNAKE_CASE

# SOLO PRACTICA LOCAL: cambia JWT_SECRET por uno largo, aleatorio y privado.
# La clave por defecto es PUBLICA y NO sirve para una aplicacion real.
seguridad.jwt.secret=${JWT_SECRET:SOLO_PRACTICA_CAMBIAR_ESTA_CLAVE_PUBLICA_DE_40_CARACTERES_987654321}
seguridad.jwt.duracion-segundos=3600
